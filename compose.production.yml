name: nexora
services:
  app:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      TRUSTED_PROXIES: 172.28.91.2/32
    volumes:
      - platform_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 90s
    networks:
      web:
        ipv4_address: 172.28.91.3
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Configure APP_DOMAIN}
      TLS_CONTACT_EMAIL: ${TLS_CONTACT_EMAIL:?Configure TLS_CONTACT_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      web:
        ipv4_address: 172.28.91.2
    depends_on:
      app:
        condition: service_healthy
networks:
  web:
    ipam:
      config:
        - subnet: 172.28.91.0/24
volumes:
  platform_data:
  caddy_data:
  caddy_config:
